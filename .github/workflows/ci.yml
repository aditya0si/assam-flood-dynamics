name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-m0:
    name: verify:m0 (headless Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # Plain install and build only. The Windows sandbox shims
      # (dev:sandbox / build:sandbox / preview:sandbox) are never used in CI.
      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Run M0 acceptance
        run: npm run verify:m0

      - name: Upload failure artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m0-playwright-${{ github.run_attempt }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  pipeline-tests:
    name: pipeline pytest (headless Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install pipeline
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r pipeline/requirements.txt
          python -m pip install -e pipeline

      - name: Run pipeline unit tests
        working-directory: pipeline
        run: python -m pytest tests -q

